[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "js-secrets-scanner"
version = "0.1.0"
description = "Escáner de secretos y endpoints en JavaScript para pentesters"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyyaml>=6", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jsscan = "jsscan.cli:main"

[tool.setuptools.packages.find]
include = ["jsscan*"]
